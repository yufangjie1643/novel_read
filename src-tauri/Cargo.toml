[package]
name = "legado-desktop"
version = "0.1.0"
description = "Legado novel reader for desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "legado_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "chrono"] }
deadpool = "0.13"
deadpool-sync = "0.2"
deadpool-sqlite = "0.13"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"

# Book source engine
rquickjs = { version = "0.9", features = ["futures", "macro"] }
scraper = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "gzip", "rustls-tls", "charset", "http2"] }
regex = "1"
encoding_rs = "0.8"
url = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tiny_http = "0.12"
epub = "2"
zip = { version = "3", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.9", features = ["bindgen"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
